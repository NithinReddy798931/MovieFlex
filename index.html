<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="intro-screen">

    <audio id="introSound" >
        <source src="assets/intro.mp3" type="audio/mpeg">
    </audio>

    <div class="light left-light"></div>

    <div class="logo-wrapper">
        <h1 class="intro-logo">N</h1>
        <p class="intro-text">NITHINFLIX</p>
    </div>

    <div class="light right-light"></div>

</div>


    <nav>
        <div class = logo>N <span>MOVIEFLIX</span>
            
        </div>
        <ul>
            <li>Home</li>
            <li id="favoritesBtn">
                Favorites 
            </li>
            <li>History 🕒</li>
        </ul>
    
    </nav>


    <section class="hero">

        <div class="overlay"></div>

        <div class="hero-content">

            <h1>Unlimited Movies, TV Shows and More</h1>

            <p>Search your favourite movies instantly.</p>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Movie..."
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

        </div>

    </section>

    

    <footer>

        <h3>NIHTINFLIX</h3>

        <p>
            Watch and search movies easily.
        </p>

        <p>
            © 2026 NIHTINFLIX
        </p>

    </footer>


    <script src="app.js"></script>
</body>
</html>
